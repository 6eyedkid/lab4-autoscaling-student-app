<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Добавить студента</title><style>body{font:16px Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 18px;color:#1f2937}label{display:block;margin:18px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #94a3b8;border-radius:5px}button,a{display:inline-block;margin-top:18px;padding:10px 15px;border:0;border-radius:5px;background:#1d4ed8;color:white;text-decoration:none;cursor:pointer}</style></head><body><h1>Новый студент</h1><form action="{{ url_for('add') }}" method="post" enctype="multipart/form-data"><label for="name">ФИО студента</label><input id="name" name="name" required><label for="group">Группа</label><input id="group" name="group" required><label for="description">Направление / примечание</label><textarea id="description" name="description" rows="3"></textarea><label for="file">Фото или изображение (PNG, JPG, WEBP, SVG)</label><input id="file" name="file" type="file" accept="image/*"><button type="submit">Сохранить</button> <a href="{{ url_for('index') }}">Назад к списку</a></form></body></html>
